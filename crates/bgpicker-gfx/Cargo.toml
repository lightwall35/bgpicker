[package]
name = "bgpicker-gfx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unified Wayland layer-shell GPU renderer for bgpicker wallpaper and backdrop layers"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
calloop = "0.14"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
khronos-egl = { version = "6.0", features = ["static", "1_5"] }
log = "0.4"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
thiserror = "2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
