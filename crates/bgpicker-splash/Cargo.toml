[package]
name = "bgpicker-splash"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Ultra-lightweight pure-Rust Wayland wl_shm boot placeholder for bgpicker (zero EGL/Cairo/X11)"

[[bin]]
name = "bgpicker-splash"
path = "src/bin/bgpicker-splash.rs"

[dependencies]
bgpicker-core = { path = "../bgpicker-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
libc = "0.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
