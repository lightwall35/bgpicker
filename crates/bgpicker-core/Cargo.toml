[package]
name = "bgpicker-core"
version = "0.1.0"
edition = "2021"
description = "Core state, niri IPC, geometry math, config, media catalog, and daemon protocol for bgpicker"

[dependencies]
libc = "0.2"
percent-encoding = "2.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
