[package]
name = "bgpicker-daemon"
version = "0.1.0"
edition = "2021"
description = "Unified Wayland wallpaper daemon and CLI client (bgpicker-daemon + bgpickerctl)"

[[bin]]
name = "bgpicker-daemon"
path = "src/bin/bgpicker-daemon.rs"

[[bin]]
name = "bgpickerctl"
path = "src/bin/bgpickerctl.rs"

[dependencies]
bgpicker-core = { path = "../bgpicker-core" }
bgpicker-gfx = { path = "../bgpicker-gfx" }
bgpicker-video = { path = "../bgpicker-video" }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
